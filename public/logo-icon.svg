<svg width="64" height="64" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nw-wave-grad" x1="4" y1="36" x2="36" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="nw-synapse-grad" x1="8" y1="20" x2="32" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>
    <filter id="nw-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="1" y="1" width="38" height="38" rx="10" fill="#07070A" stroke="url(#nw-wave-grad)" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Harmonic neural wave -->
  <path d="M 8 28 C 8 16, 13 10, 16 10 C 19 10, 20 23, 23 23 C 26 23, 27 12, 31 12 C 33 12, 33 26, 30 29" stroke="url(#nw-wave-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#nw-glow)" />

  <!-- Synapse connection track -->
  <path d="M 12 24 L 16 12 L 20 22 L 24 16 L 28 26" stroke="url(#nw-synapse-grad)" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2.5" stroke-opacity="0.9" />

  <!-- Synapse Nodes -->
  <circle cx="8" cy="28" r="2.2" fill="#8B5CF6" />
  <circle cx="8" cy="28" r="0.9" fill="#FFFFFF" />

  <circle cx="16" cy="11" r="2.4" fill="#A78BFA" />
  <circle cx="16" cy="11" r="1" fill="#FFFFFF" />

  <circle cx="21" cy="22" r="2" fill="#6366F1" />
  <circle cx="21" cy="22" r="0.8" fill="#FFFFFF" />

  <circle cx="27" cy="14" r="2.2" fill="#38BDF8" />
  <circle cx="27" cy="14" r="0.9" fill="#FFFFFF" />

  <circle cx="30" cy="29" r="2.4" fill="#22D3EE" />
  <circle cx="30" cy="29" r="1" fill="#FFFFFF" />
</svg>
