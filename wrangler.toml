# ADMIN_EMAILS / ADMIN_EMAIL are deliberately NOT set here. The admin allowlist
# must not be published in the repository — it is precisely what an attacker
# would target. Set it as an encrypted Worker secret instead:
#   npx wrangler secret put ADMIN_EMAILS
# The admin check fails closed, so the panel is inaccessible until you do.

# Weekly lead digest.
#
# The previous configuration declared this schedule in vercel.json only, which
# Cloudflare Workers ignores entirely, so the digest never ran in production.
#
# ⚠️  This trigger alone is NOT sufficient. A Cloudflare Cron Trigger invokes the
#     Worker's `scheduled` handler; it does not make an HTTP request. The Worker
#     that @opennextjs/cloudflare generates exports only `fetch`, so a scheduled
#     event has nothing to handle it and /api/cron/lead-digest is never called.
#
# Pick one:
#
#   (a) Add a small second Worker whose scheduled handler fetches the endpoint
#       with the bearer token, e.g.
#
#         export default {
#           async scheduled(_event, env) {
#             await fetch("https://<your-host>/api/cron/lead-digest", {
#               headers: { Authorization: `Bearer ${env.CRON_SECRET}` },
#             });
#           },
#         };
#
#   (b) Extend the generated Worker to forward `scheduled` to your own handler by
#       wrapping `.open-next/worker.js` in a custom entry point.
#
# The endpoint fails closed without CRON_SECRET, so either way:
#   npx wrangler secret put CRON_SECRET
[triggers]
crons = ["0 8 * * 1"]

# Incremental cache for ISR / revalidatePath persistence.
#
# Deliberately NOT enabled yet: adding an r2_buckets binding requires the bucket
# to exist first or `wrangler deploy` will fail. Create the bucket, then add:
#
#   [[r2_buckets]]
#   binding = "NEXT_INC_CACHE_R2_BUCKET"
#   bucket_name = "nurix-incremental-cache"
#
# ...and configure `incrementalCache` in open-next.config.ts.
