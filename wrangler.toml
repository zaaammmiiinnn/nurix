# Cloudflare Workers deployment (via @opennextjs/cloudflare).
#
# NOTE: `name` is the Worker name, which determines the *.workers.dev hostname
# and the entry in the Cloudflare dashboard. It is still the internal project
# name "nurix" while the public brand is NeuralWaves. Renaming it here (and in
# package.json / the GitHub repo) is safe once you are ready to re-create the
# Worker under the new name — see AUDIT.md section on branding.

name = "nurix"
main = ".open-next/worker.js"

# Was 2024-12-30, roughly 22 months behind OpenNext's own default. Keep this
# reasonably current so Workers runtime behaviour matches what Next expects.
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

assets = { directory = ".open-next/assets", binding = "ASSETS" }

[vars]
NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_test_c3Ryb25nLWRvZ2Zpc2gtMzU0Ni5jbGVyay5hY2NvdW50cy5kZXYk"
NEXT_PUBLIC_CLERK_SIGN_IN_URL = "/sign-in"
NEXT_PUBLIC_CLERK_SIGN_UP_URL = "/sign-up"
NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL = "/admin"
NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL = "/"
NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL = "/"
NEXT_PUBLIC_SUPABASE_URL = "https://vbinpwwerrvkqcaqqxls.supabase.co"
